<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <!-- Served by the picker server: the app's theme and Manrope, the same
       dialog look as the OAuth pages (electron/browser-page.ts). -->
  <link rel="stylesheet" href="/lumia-page.css" />
  <title>Choose a Drive folder</title>
</head>
<body>
  <main class="box" id="box">
    <div class="text">
      <h1 id="title">Choose a Drive folder</h1>
      <p id="body" hidden></p>
    </div>
    <div class="wait" id="wait">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
      <span>Opening Google Drive…</span>
    </div>
    <div class="message" id="message" role="alert" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
      <div><div class="what" id="what"></div><div class="why" id="why" hidden></div></div>
    </div>
  </main>
  <script src="https://apis.google.com/js/api.js"></script>
  <script>
    (function () {
      var box = document.getElementById('box')
      var title = document.getElementById('title')
      var body = document.getElementById('body')
      var wait = document.getElementById('wait')
      var message = document.getElementById('message')
      var what = document.getElementById('what')
      var why = document.getElementById('why')
      var RETRY = 'Try again in Lumia (Settings › Uploads).'
      var CLOSE = 'You can close this tab.'

      // The body paragraph: lines that stand apart follow a blank line.
      // Text only (the folder name comes from Drive), `strong` marks a name.
      function setBody(parts) {
        body.textContent = ''
        parts.forEach(function (part, i) {
          if (i > 0) { body.appendChild(document.createElement('br')); body.appendChild(document.createElement('br')) }
          ;(Array.isArray(part) ? part : [part]).forEach(function (bit) {
            if (typeof bit === 'string') body.appendChild(document.createTextNode(bit))
            else { var s = document.createElement('strong'); s.textContent = bit.strong; body.appendChild(s) }
          })
        })
        body.hidden = false
      }
      function show(t, parts, error) {
        box.hidden = false
        wait.hidden = true
        title.textContent = t
        document.title = t
        setBody(parts)
        message.hidden = !error
        if (error) {
          what.textContent = error.message
          why.textContent = error.detail || ''
          why.hidden = !error.detail
        }
      }
      function failed(parts, error) { show("Couldn't open folder picker", parts, error) }

      var params = new URLSearchParams(location.search)
      var nonce = params.get('nonce')
      if (!nonce) { failed(['Open it from Lumia (Settings › Uploads).']); return }

      function postResult(result) {
        return fetch('/result?nonce=' + encodeURIComponent(nonce), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(result),
          keepalive: true
        }).catch(function () { /* server may be closed already, ignore */ })
      }

      fetch('/config?nonce=' + encodeURIComponent(nonce))
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json() })
        .then(function (cfg) {
          if (!cfg.token) { failed(['Connect Google Drive in Lumia first (Settings › Uploads).']); return }
          if (!cfg.apiKey || !cfg.appId) {
            failed([CLOSE], { message: 'Not available in this version of Lumia' })
            return
          }

          if (typeof gapi === 'undefined') {
            failed([RETRY], { message: "Google's picker didn't load", detail: 'Couldn\'t reach apis.google.com' })
            return
          }
          gapi.load('picker', {
            callback: function () {
              try {
                var view = new google.picker.DocsView(google.picker.ViewId.FOLDERS)
                  .setIncludeFolders(true)
                  .setSelectFolderEnabled(true)
                  .setMimeTypes('application/vnd.google-apps.folder')
                var picker = new google.picker.PickerBuilder()
                  .setOAuthToken(cfg.token)
                  .setDeveloperKey(cfg.apiKey)
                  .setAppId(cfg.appId)
                  .addView(view)
                  .setTitle('Choose a folder')
                  .setCallback(function (data) {
                    if (data.action === google.picker.Action.PICKED) {
                      var doc = data.docs && data.docs[0]
                      var result = doc ? { id: doc.id, name: doc.name } : null
                      postResult(result).then(function () {
                        if (doc) show('Folder chosen', [['Uploads go to ', { strong: doc.name }, '.'], CLOSE])
                        else show('No folder chosen', ['Your upload folder didn\'t change.', CLOSE])
                      })
                    } else if (data.action === google.picker.Action.CANCEL) {
                      postResult(null).then(function () { show('No folder chosen', ['Your upload folder didn\'t change.', CLOSE]) })
                    }
                  })
                  .build()
                picker.setVisible(true)
                // Google's picker draws its own dialog over the page.
                box.hidden = true
              } catch (err) {
                failed([RETRY], { message: "Google's picker didn't load", detail: (err && err.message) ? err.message : String(err) })
              }
            },
            onerror: function (err) { failed([RETRY], { message: "Google's picker didn't load", detail: String(err) }) }
          })
        })
        .catch(function (err) {
          failed(['Choose Browse again in Lumia (Settings › Uploads).'], { message: 'Link expired', detail: err.message })
        })
    })()
  </script>
</body>
</html>
